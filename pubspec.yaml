name: astryx_ui
description: >-
  A Flutter design system, token-compatible with Astryx. Faithful theme engine,
  themeable components, built on flutter/widgets.
version: 0.0.6-dev
homepage: https://astryxui.web.app/
repository: https://github.com/JayashBhandary/astryx_ui
issue_tracker: https://github.com/JayashBhandary/astryx_ui/issues
documentation: https://astryxui.web.app/introduction
topics:
  - user-interface
  - design-system
  - widgets
  - theming

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  # Deep-equality helpers for theme class == / hashCode.
  collection: ">=1.19.0 <2.0.0"
  flutter:
    sdk: flutter
  # Default icon registry. Astryx maps its semantic icon names onto Lucide
  # (packages/themes/*/src/icons.tsx); this keeps that mapping intact.
  lucide_icons_flutter: ">=3.0.0 <4.0.0"
  # @immutable, @internal, @visibleForTesting annotations.
  meta: ">=1.16.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 10.0.0 is the newest release that still supports the declared Dart floor
  # (^3.9.0). Newer 10.x releases raise it; pub picks the highest compatible
  # with whatever SDK is running. See dev/phases/PHASE-00-foundation.md P0-12.
  very_good_analysis: ">=10.0.0 <11.0.0"

flutter:
