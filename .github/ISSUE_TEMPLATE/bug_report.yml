name: Bug report
description: A widget or the theme engine behaves incorrectly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A widget bug here is nearly always a bug in **one configuration and not another**, so the
        configuration is most of the report. The four pickers at the top of
        [astryxui.web.app](https://astryxui.web.app/) let you narrow it down before you file: if you can
        reproduce it on the documentation site, a page URL plus the four settings below is a complete report.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues.
          required: true
        - label: I checked the [changelog](https://astryxui.web.app/changelog) in case this changed deliberately.
          required: true
        - label: I read the component's own page, which states its known limitations.
          required: false

  - type: input
    id: version
    attributes:
      label: astryx_ui version
      description: From your `pubspec.lock`, not your `pubspec.yaml`.
      placeholder: 0.0.6-dev
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component or area
      description: The widget, or the part of the theme engine.
      placeholder: AstryxTable — sorting, or defineTheme — colour expansion
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happens, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Smallest widget tree that shows it
      description: |
        The package has no runtime configuration to rule out, so a small tree really is enough. Include the
        `AstryxApp` or `AstryxThemeProvider` wrapper, since the theme, density and direction all come from there.
      render: dart
      placeholder: |
        AstryxApp(
          theme: matchaTheme,
          home: const AstryxButton(label: 'Save'),
        )
    validations:
      required: true

  - type: input
    id: docs-url
    attributes:
      label: Reproduced on the documentation site?
      description: If it happens there too, paste the page URL — pages are linkable, e.g. `astryxui.web.app/card`.
      placeholder: https://astryxui.web.app/table
    validations:
      required: false

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - neutral
        - matcha
        - stone
        - gothic
        - chocolate
        - y2k
        - butter
        - A custom theme (defineTheme)
        - Every theme — not theme-specific
    validations:
      required: true

  - type: dropdown
    id: brightness
    attributes:
      label: Brightness
      options:
        - Light
        - Dark
        - Both
    validations:
      required: true

  - type: dropdown
    id: density
    attributes:
      label: Density
      description: Touch density raises every tap target to 48px and disables hover-only affordances, so it is a different code path.
      options:
        - Pointer
        - Touch
        - Both
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Text direction
      options:
        - LTR
        - RTL
        - Both
    validations:
      required: true

  - type: input
    id: platforms
    attributes:
      label: Platforms
      placeholder: macOS 15, Chrome 131, Android 15
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: flutter doctor -v
      render: text
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: What Astryx does
      description: |
        Optional, but it settles the issue fast. If [astryx.atmeta.com](https://astryx.atmeta.com) behaves the
        same way, this is fidelity rather than a bug — the `stone` theme's 1.00:1 `--color-on-error` is
        reproduced on purpose and pinned by a test. A divergence is a bug; a faithfully reproduced defect is a
        documented limitation.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag files in. For a layout or colour problem, one screenshot usually replaces three paragraphs.
    validations:
      required: false
