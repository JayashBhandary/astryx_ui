include: package:very_good_analysis/analysis_options.yaml

# The docs site is an application, not a published library. Two relaxations
# against the package's own rules, both deliberate:
#
#   * No public API docs — nothing here is public API.
#   * Material is allowed for the window around the docs (the scaffold and the
#     scrollbars). Everything inside it is built from astryx_ui.
linter:
  rules:
    public_member_api_docs: false
    always_put_required_named_parameters_first: false
    # The documentation content in `lib/docs/pages/` is prose in list
    # literals — table rows and bullet lists, wrapped at 80 columns. Adjacent
    # string literals there are always deliberate, and the rule's real target
    # (a forgotten comma) cannot hide in a table whose row width is checked.
    no_adjacent_strings_in_list: false

analyzer:
  errors:
    specify_nonobvious_property_types: ignore
  # `lib/docs/*.g.dart` is produced by `tool/gen_snippets.dart`. It holds the
  # examples' source as string literals, so its formatting is the examples'
  # formatting and not something a linter can have an opinion about.
  exclude:
    - lib/docs/**.g.dart
