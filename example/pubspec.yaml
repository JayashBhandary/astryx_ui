name: example
description: The astryx_ui documentation site — every component, live, in eight themes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  astryx_ui:
    path: ../
  flutter:
    sdk: flutter
  # The web URL strategy, so pages are /tokens rather than /#/tokens.
  flutter_web_plugins:
    sdk: flutter
  # The chrome needs two glyphs the package's registry does not name — a
  # monitor and a phone. `AstryxIconName` is a transcription of upstream's
  # `IconName` union and should stay one, so the docs app reaches for the same
  # icon family the registry resolves to rather than widening the enum.
  lucide_icons_flutter: ">=3.0.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=10.0.0 <11.0.0"

flutter:
  uses-material-design: true
